name: Deploy to Azure Container Apps

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-evently
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: evently-api
            dockerfile: src/API/Evently.Api/Dockerfile
            image: evently-api
          - app: evently-ticketing-api
            dockerfile: src/API/Evently.Ticketing.Api/Dockerfile
            image: evently-ticketing-api
          - app: evently-gateway
            dockerfile: src/API/Evently.Gateway/Dockerfile
            image: evently-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ env.ACR_LOGIN_SERVER }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}

      - name: Roll out new image
        run: |
          az containerapp update \
            --name ${{ matrix.app }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}
